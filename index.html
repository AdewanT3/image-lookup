<!DOCTYPE html>
<html>
<head>
    <title>Schematic Lookup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 36px;
        }

        input {
            font-size: 24px;
            padding: 10px;
            width: 300px;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }

        img {
            margin-top: 30px;
            max-width: 1000px;
            max-height: 800px;
        }
    </style>
</head>

<body>

<h1>Enter Store Number</h1>

<input type="text" id="storeNumber" placeholder="Store Number">
<button onclick="findImage()">Search</button>

<br><br>

<img id="resultImage">

<br><br>

<button onclick="history.back()">
    Return to Survey
</button>

<script>

let lookup = {};

fetch("part_lookup.csv")
.then(response => response.text())
.then(text => {

    const rows = text.trim().split(/\r?\n/);

    for (let i = 1; i < rows.length; i++) {

        const columns = rows[i].split(",");

        const storeNumber = columns[0]?.trim();
        const schematic = columns[1]?.trim();

        if (storeNumber && schematic) {
            lookup[storeNumber] = schematic;
        }
    }
});

function findImage() {

    const store =
        document.getElementById("storeNumber").value.trim();

    const image = lookup[store];

    if (image) {
        document.getElementById("resultImage").src = image;
    } else {
        alert("Store number not found");
    }
}

document
.getElementById("storeNumber")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        findImage();
    }

});

</script>

</body>
</html>
