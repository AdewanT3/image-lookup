<!DOCTYPE html>
<html>
<head>
    <title>Schematic Lookup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            font-size: 36px;
        }

        input {
            font-size: 24px;
            padding: 10px;
            width: 300px;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            cursor: pointer;
        }

        img {
            margin-top: 30px;
            max-width: 1000px;
            max-height: 800px;
        }
    </style>
</head>

<body>

<h1>Enter Store Number</h1>

<input type="text" id="storeNumber" placeholder="Store Number">
<button onclick="findImage()">Search</button>

<br><br>

<img id="resultImage">

<script>

let lookup = {};

window.addEventListener("load", async () => {

    const response = await fetch("part_lookup.csv");
    const text = await response.text();

    const lines = text.trim().split(/\r?\n/);

    for (let i = 1; i < lines.length; i++) {

        const [store, image] = lines[i].split(",");

        if (store && image) {
            lookup[store.trim()] = image.trim();
        }
    }
});

function findImage() {

    const store =
        document.getElementById("storeNumber").value.trim();

    if (lookup[store]) {

        document.getElementById("resultImage").src =
            lookup[store];

    } else {

        alert("Store number not found");
    }
}

document.getElementById("storeNumber")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        findImage();
    }

});

</script>

</body>
</html>
