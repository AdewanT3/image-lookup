<!DOCTYPE html>
<html>
<head>
    <title>Schematic Lookup</title>
</head>
<body>

<h2>Enter Store Number</h2>

<input id="storeNumber">
<button onclick="findImage()">Search</button>

<br><br>

<img id="resultImage" width="600">

<script>

let lookup = {};

fetch('part_lookup.csv')
.then(response => response.text())
.then(data => {

    let rows = data.split('\n');

    rows.slice(1).forEach(row => {

        let cols = row.split(',');

        if(cols.length >= 2){

            lookup[cols[0].trim()] =
            cols[1].trim() + ".png";
        }
    });
});

function findImage(){

    let store =
    document.getElementById("storeNumber").value;

    let image = lookup[store];

    if(image){

        document.getElementById("resultImage").src =
        image;

    } else {

        alert("Store number not found");
    }
}

</script>

</body>
</html>
