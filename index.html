<!DOCTYPE html>
<html>
<head>
    <title>Schematic Lookup</title>
</head>
<body>

<h2>Enter Store Number</h2>

<input id="storeNumber">
<button onclick="findImage()">Search</button>

<br><br>

<img id="resultImage" width="600">

<script>

let lookup = {
    "7": "Schematic10.png",
    "8": "Schematic4.png",
    "12": "Schematic9.png",
    "23": "Schematic15.png"
};

function findImage(){

    let store = document.getElementById("storeNumber").value;

    let image = lookup[store];

    if(image){

        document.getElementById("resultImage").src = image;

    } else {

        alert("Store number not found");
    }
}

</script>

</body>
</html>
